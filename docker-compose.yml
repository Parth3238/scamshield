# ScamShield full stack: postgres + backend + frontend.
# All secrets come from the root .env file (never committed).
# Required variables fail fast with a clear message via ${VAR:?message}.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No ports: reachable only inside the compose network.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set. Copy .env.example to .env and fill it.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and fill it.}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set. Copy .env.example to .env and fill it.}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    # No ports: the browser talks to the frontend, which proxies /api/*.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is not set. Copy .env.example to .env and fill it.}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and fill it.}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is not set. Copy .env.example to .env and fill it.}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set. Copy .env.example to .env and fill it.}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Copy .env.example to .env and fill it.}@redis:6379/0
      RUN_MIGRATIONS: "true"
      ENVIRONMENT: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes: [] # no bind mounts: code comes from the image
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true
    # Healthcheck comes from the backend image (python GET /health).

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No ports: only the backend talks to Redis, inside the network.
    # No volume: rate-limit counters may be lost on restart by design.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Copy .env.example to .env and fill it.}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Copy .env.example to .env and fill it.}
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000" # only this service is reachable from the host
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true
    # Healthcheck comes from the frontend image (node GET /).

volumes:
  pgdata: # named volume: database files survive container restarts

networks:
  appnet: # dedicated network: postgres/backend are hidden from the host
